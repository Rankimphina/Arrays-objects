<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1583364486567-ce2e045676e9?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8d2Vic2l0ZSUyMGJhY2tncm91bmR8ZW58MHx8MHx8fDA%3D');">
  <!-- Navbar -->
  <nav class="bg-white shadow-md px-8 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-900">📝MyTask Manager</h1>
    <ul class="flex gap-6 text-gray-600 font-medium">
      <li><a href="#" class="hover:text-blue-500">Home</a></li>
      <li><a href="#" class="hover:text-blue-500">My Tasks</a></li>
      <li><a href="#" class="hover:text-blue-500">About</a></li>
    </ul>
  </nav>

  <!-- Main content -->
  <section class="flex justify-center pt-16 px-4">
    <div class="w-full max-w-md bg-white bg-opacity-90 rounded-2xl shadow-lg p-8">

      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">My Task List</h2>
  
      <!-- Input row -->
      <div class="flex gap-2 mb-6">
        <input id="taskInput" type="text" placeholder="Enter a task..."
          class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button id="addBtn" class="bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-600">
          Add
        </button>
      </div>

      <!-- Task list -->
      <ul id="taskList" class="flex flex-col gap-3">

        <li id="task-1" class="bg-white rounded-lg px-4 py-3 flex items-center gap-3 shadow-sm">
          <input type="checkbox" class="w-5 h-5 cursor-pointer" />
          <span class="flex-1 text-gray-800">Buy groceries</span>
          <button class="bg-gray-900 text-white text-sm px-3 py-1 rounded-lg hover:bg-gray-700">Delete</button>
        </li>

        <li id="task-2" class="bg-white rounded-lg px-4 py-3 flex items-center gap-3 shadow-sm">
          <input type="checkbox" class="w-5 h-5 cursor-pointer" />
          <span class="flex-1 text-gray-800">Read a book</span>
          <button class="bg-gray-900 text-white text-sm px-3 py-1 rounded-lg hover:bg-gray-700">Delete</button>
        </li>

        <li id="task-3" class="bg-white rounded-lg px-4 py-3 flex items-center gap-3 shadow-sm">
          <input type="checkbox" class="w-5 h-5 cursor-pointer" />
          <span class="flex-1 text-gray-800">Finish assignment</span>
          <button class="bg-gray-900 text-white text-sm px-3 py-1 rounded-lg hover:bg-gray-700">Delete</button>
        </li>

      </ul>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
